name: "Basic Website Check"
description: "Simple check to verify a website loads and renders correctly"
target_url: "https://example.com"
mode: "sequential"

agents:
  - type: navigator
    task: "Navigate to {target_url} and wait for the page to fully load"

  - type: vision
    task: "Take a screenshot and verify the page renders correctly with no broken images or layout issues"

  - type: validator
    task: "Verify that the page title is present and the main heading is visible"

metadata:
  author: "MonitorLab"
  version: "1.0"
  tags: ["basic", "smoke-test"]
