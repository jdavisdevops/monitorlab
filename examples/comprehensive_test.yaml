name: "Comprehensive E-Commerce Test"
description: "Complete test of e-commerce site functionality including navigation, search, and product viewing"
target_url: "https://example-shop.com"
mode: "sequential"

agents:
  - type: navigator
    task: "Navigate to {target_url} and wait for the homepage to fully load including all images and content"

  - type: vision
    task: "Verify homepage renders correctly with header, navigation menu, hero section, and product grid all visible and properly styled"

  - type: validator
    task: "Verify that the search bar, shopping cart icon, and main navigation links are all present and functional"

  - type: interaction
    task: "Type 'laptop' into the search bar and submit the search"

  - type: navigator
    task: "Wait for the search results page to load completely"

  - type: vision
    task: "Take a screenshot and verify search results are displayed with product images, titles, and prices visible"

  - type: validator
    task: "Verify that at least 3 products are shown in the search results and each has an image, title, and price"

  - type: interaction
    task: "Click on the first product in the search results"

  - type: navigator
    task: "Wait for the product detail page to load"

  - type: vision
    task: "Verify the product detail page shows product images, description, price, and add to cart button with proper styling"

  - type: validator
    task: "Verify that the product title, price, description, and 'Add to Cart' button are all present on the page"

metadata:
  author: "MonitorLab"
  version: "1.0"
  tags: ["e-commerce", "comprehensive", "search", "products"]
  estimated_duration: "60s"
