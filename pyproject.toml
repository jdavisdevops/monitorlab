[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorlab"
version = "0.1.0"
description = "AI-enhanced browser automation and website monitoring system with vision capabilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MonitorLab Team"}
]
dependencies = [
    "playwright>=1.40.0",
    "openai>=1.0.0",  # For LM Studio API compatibility
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
    "gradio>=4.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
monitorlab-chat = "monitorlab.chat.cli:main"
monitorlab-run = "monitorlab.cli:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
